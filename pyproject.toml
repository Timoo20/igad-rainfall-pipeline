[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igad-rainfall"
version = "0.1.0"
description = "Daily CHIRPS rainfall monitoring for the Greater Horn of Africa: COG, Zarr, STAC and PostGIS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "dask[array]",
    "rasterio>=1.3",
    "rioxarray",
    "zarr",
    "pystac[validation]",
    "geopandas",
    "shapely>=2",
    "requests",
    "prefect>=3",
]

[project.optional-dependencies]
db = ["sqlalchemy>=2", "geoalchemy2", "psycopg[binary]>=3"]
dev = ["pytest", "ruff"]

[project.scripts]
igad-rainfall = "igad_rainfall.flows:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
